<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #6f2da86c;
            background-image: url("grape_e.png");
            background-repeat: no-repeat;
            background-position: right top;
            margin-right: 200px;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>광야</h1>
    <p>까마득한 날에</p>
    <p>하늘이 처음 열리고</p>
    <p>어데 닭 우는 소리 들렸으랴</p>
    <br>
    <p>모든 산맥들이</p>
    <p>바다를 연모해 휘달릴 때도</p>
    <p>차마 이곳을 범하던 못하였으리라</p>
    <br>
    <p>끊임없는 광음을</p>
    <p>부지런한 계절이 피어선 지고</p>
    <p>큰 강물이 비로소 길을 열었다</p>
    <br>
    <p>지금 눈 내리고</p>
    <p>매화 향기 홀로 아득하니</p>
    <p>내 여기 가난한 노래의 씨를 뿌려라</p>
    <br>
    <p>다시 천고의 뒤에</p>
    <p>백마 타고 오는 초인이 있어</p>
    <p>이 광야에서 목 놓아 부르게 하리라</p>
</body>
</html>
